/* DATA */
const W=[["🐱","kucing","hewan berkaki empat, suka makan ikan"],["🐟","ikan","hidup dan berenang di air"],["📚","buku","kumpulan kertas untuk dibaca"],["🚲","sepeda","kendaraan roda dua yang dikayuh"],["🍎","apel","buah bulat merah atau hijau"],["🏠","rumah","tempat kita tinggal"],["🌸","bunga","tumbuhan berwarna indah dan harum"],["☀️","matahari","menyinari bumi pada siang hari"],["🌙","bulan","tampak di langit malam"],["🌧️","hujan","air yang jatuh dari awan"],["🌳","pohon","tumbuhan besar berbatang kayu"],["🐦","burung","hewan berbulu yang bisa terbang"],["🚗","mobil","kendaraan roda empat"],["👟","sepatu","dipakai di kaki"],["🧢","topi","dipakai di kepala"],["🥛","susu","minuman putih menyehatkan"],["🍞","roti","makanan dari tepung yang dipanggang"],["✏️","pensil","alat untuk menulis"],["🎒","tas","tempat membawa buku"],["🐔","ayam","berkokok dan bertelur"],["🐮","sapi","hewan besar penghasil susu"],["⚽","bola","benda bulat untuk bermain"],["⏰","jam","penunjuk waktu"],["☂️","payung","pelindung dari hujan"],["🍌","pisang","buah berkulit kuning"],["🐰","kelinci","berbulu lembut bertelinga panjang"],["🐘","gajah","hewan besar berbelalai"],["🍚","nasi","makanan pokok dari beras"],["🐶","anjing","hewan yang setia menjaga rumah"],["🍉","semangka","buah besar, isinya merah dan segar"],["🍇","anggur","buah kecil bergerombol"],["🚌","bus","kendaraan besar untuk banyak orang"],["✈️","pesawat","kendaraan yang terbang di langit"],["⭐","bintang","bersinar di langit malam"],["🥕","wortel","sayuran berwarna oranye"],["🐢","kura-kura","hewan bercangkang, jalannya lambat"],["🪑","kursi","tempat duduk"],["🛏️","kasur","tempat tidur"],["🚪","pintu","jalan masuk ke dalam rumah"],["🔑","kunci","alat untuk membuka pintu"]];

const TX=[{t:"Rani memelihara seekor kucing bernama Mimi. Mimi berbulu putih dan suka tidur di kursi. Setiap pagi, Rani memberi Mimi susu hangat.",q:[["Siapa nama kucing Rani?","Mimi",["Mimi","Tiko","Putih","Rani"]],["Apa warna bulu Mimi?","putih",["putih","hitam","kuning","abu-abu"]],["Apa yang Rani berikan setiap pagi?","susu hangat",["susu hangat","ikan","roti","air dingin"]]]},{t:"Hari ini hujan turun deras. Budi membawa payung biru ke sekolah. Ia memakai sepatu dan jas hujan agar tidak basah.",q:[["Apa yang Budi bawa ke sekolah?","payung biru",["payung biru","topi merah","bola","sepeda"]],["Bagaimana cuaca hari ini?","hujan deras",["hujan deras","panas","cerah","berangin"]]]}];

const MT=[["🐾","Kata Benda","Kata benda adalah nama orang, hewan, atau benda.","kucing, buku, Ibu, sepeda"],["🏃","Kata Kerja","Kata kerja menunjukkan kegiatan atau perbuatan.","berlari, menulis, makan, membaca"],["🌈","Kata Sifat","Kata sifat menerangkan keadaan atau ciri sesuatu.","besar, indah, rajin, panas"],["🔄","Persamaan Kata","Kata yang artinya hampir sama.","cantik = indah, pintar = pandai"],["↔️","Lawan Kata","Kata yang artinya berlawanan.","besar ↔ kecil, siang ↔ malam"],["🧩","Menyusun Kalimat","Kalimat terdiri dari siapa atau apa, kegiatan, dan tempat. Awali dengan huruf kapital.","Adik bermain bola di lapangan."],["❗","Tanda Baca","Titik (.) untuk kalimat biasa, tanda tanya (?) untuk pertanyaan, tanda seru (!) untuk seruan.","Siapa namamu? Aku senang sekali!"],["🔍","Membaca Teks Pendek","Baca pelan-pelan. Cari jawaban dengan kata tanya: siapa, apa, di mana, kapan, bagaimana.","Rani memberi Mimi susu. Siapa memberi susu? Rani."],["❓","Kata Tanya","Kata tanya dipakai untuk bertanya: siapa, apa, di mana, kapan, mengapa, bagaimana.","Siapa namamu? Di mana rumahmu?"],["📍","Kata Depan","Kata depan menunjukkan tempat: di, ke, dari.","Aku pergi ke sekolah. Buku ada di tas."],["🙋","Kata Ganti","Kata ganti menggantikan nama orang: aku, kamu, dia, kami, mereka.","Aku suka membaca. Dia suka menggambar."],["👏","Suku Kata","Kata bisa dipecah menjadi suku kata. Ucapkan sambil bertepuk tangan.","ku cing, se pe da, ma ta ha ri"],["🔠","Huruf Kapital","Huruf kapital dipakai di awal kalimat dan pada nama orang, kota, atau hari.","Budi pergi ke Yogyakarta hari Senin."],["🐐","Tiruan Bunyi Hewan","Banyak hewan punya suara khas yang ditirukan dengan kata.","Kucing meong, kambing mbek, anjing guk guk."],["📖","Bercerita","Cerita punya awal, tengah, dan akhir. Pakai kata pertama, lalu, kemudian, akhirnya.","Pertama aku mandi. Lalu aku sarapan. Akhirnya aku berangkat."],["🔁","Kata Ulang","Kata ulang adalah kata yang diulang, sering memakai tanda hubung.","kupu-kupu, jalan-jalan, anak-anak"]];
const MS=[["🖼️","Misi 1: Tebak Gambar"],["💡","Misi 2: Makna Kata"],["🧩","Misi 3: Susun Kalimat"],["📖","Misi 4: Teks Pendek"]];
const QZ=[["C1","Kata yang tepat untuk gambar 🍌 adalah …",["pisang","apel","anggur","wortel"],0,"Gambar itu adalah pisang."],["C1","Kata benda ditunjukkan oleh kata …",["berlari","besar","meja","indah"],2,"Meja adalah nama benda."],["C1","Kata kerja ditunjukkan oleh kata …",["menulis","kursi","cantik","rumah"],0,"Menulis adalah kegiatan."],["C2","Lawan kata “tinggi” adalah …",["panjang","rendah","besar","jauh"],1,"Tinggi lawannya rendah."],["C2","Persamaan kata “pintar” adalah …",["malas","nakal","pandai","lucu"],2,"Pintar sama artinya dengan pandai."],["C2","Kalimat yang ditulis dengan benar adalah …",["ibu memasak nasi","Ibu memasak nasi.","ibu memasak nasi.","Ibu Memasak nasi"],1,"Kalimat diawali huruf kapital dan diakhiri titik."],["C3","Susunan kata “bermain, adik, bola” yang benar adalah …",["Bola adik bermain.","Bermain bola adik.","Adik bermain bola.","Adik bola bermain."],2,"Siapa (adik), kegiatan (bermain), apa (bola)."],["HOTS","Dito memakai jas hujan dan membawa payung. Mengapa Dito melakukannya?",["Karena cuaca panas","Karena sedang hujan","Karena akan tidur","Karena hari libur"],1,"Jas hujan dan payung dipakai saat hujan."],["HOTS","Kata yang tidak cocok dalam kelompok: kucing, ayam, sapi, sepatu.",["kucing","ayam","sapi","sepatu"],3,"Tiga kata lainnya adalah hewan, sepatu bukan hewan."],["HOTS","Rina tidak membawa payung saat hujan deras. Apa yang paling mungkin terjadi?",["Bajunya basah","Bajunya kering","Ia kepanasan","Ia mengantuk"],0,"Tanpa payung, Rina akan kehujanan sehingga bajunya basah."]];
const PG=[["dasbor","🏠","Dasbor"],["intro","🌟","Ayo Kenalan dengan Kata"],["materi","📘","Materi Seru"],["kamus","🔤","Kamus Gambar"],["suara","🐾","Suara Hewan"],["susun","🧩","Susun Kata"],["misi","🎮","Misi Detektif"],["game","🎯","Seret dan Cocokkan"],["kuis","📝","Kuis Evaluasi"],["ringkas","📚","Rangkuman dan Refleksi"],["hasil","🏅","Hasil Belajarku"],["panduan","❓","Cara Memakai Media"]];
const LEARN=PG.slice(1,10).map(x=>x[0]);

/* STATE */
let U=ls.g("dk3:last",null),D=null,v=U?"dasbor":"nama";
let M={m:0,qs:[],i:0,pk:null,got:0,built:[],prac:false,res:false},Q={i:0,pk:[],done:false},G={tab:0,sel:null,pl:[[],[]],pairs:null,ord:[],os:0};

function load(){D=ls.g(key(U),{v:[],m:[null,null,null,null],q:null,a:[0,0,0],s:0,r:["","",""]});D.s=D.s||0}
const prog=()=>Math.round(D.v.filter(x=>LEARN.includes(x)).length/LEARN.length*100);

async function save(){const r={nama:U.nama,kelas:U.kelas,progres:prog(),m1:D.m[0],m2:D.m[1],m3:D.m[2],m4:D.m[3],misi:msum(),kuis:D.q===null?null:D.q*10,game:act(),nilai:nilai(),waktu:new Date().toISOString()};ls.s(key(U),D);ls.s("dk3:last",U);const all=ls.g("dk3:all",{});all[key(U)]=r;ls.s("dk3:all",all);
 try{const c=await claude.use("db");if(c)await c.collection("dk3").doc(key(U).replace(/[^a-z0-9]/g,"_")).set(r)}catch(e){}}

/* QUESTIONS (misi) */
function mkQ(m){
 if(m==0)return sh(W).slice(0,5).map(w=>({e:w[0],q:"Gambar apakah ini?",o:sh([w[1],...sh(W.filter(x=>x!=w)).slice(0,3).map(x=>x[1])]),a:w[1],ex:`Ini gambar ${w[1]}: ${w[2]}.`,say:w[1]}));
 if(m==1)return sh(MK).slice(0,5).map(k=>({q:`${k[1]=="lawan"?"Lawan kata":"Persamaan kata"} “${k[0]}” adalah …`,o:sh(k[3]),a:k[2],ex:`${k[1]=="lawan"?"Lawan kata":"Persamaan kata"} “${k[0]}” adalah “${k[2]}”.`}));
 if(m==2)return sh(KL).slice(0,5).map(s=>({arr:sh(s.split(" ")),a:s,ex:`Kalimat yang benar: “${s}.” Awali dengan huruf kapital dan akhiri dengan titik.`}));
 return TX.flatMap(x=>x.q.map(q=>({tx:x.t,q:q[0],o:sh(q[2]),a:q[1],ex:`Jawabannya “${q[1]}”. Temukan di dalam teks.`})))}
function start(m,prac){M={m,qs:mkQ(m),i:0,pk:null,got:0,built:[],prac:!!prac,res:false};v="play";draw();M.qs[0].e&&say(M.qs[0].q)}

function pickT(k){const q=M.qs[M.i];if(M.pk!==null||M.built.includes(k))return;M.built.push(k);say(q.arr[k]);if(M.built.length==q.arr.length){const s=M.built.map(j=>q.arr[j]).join(" ");M.pk=s;s===q.a?(M.got++,good()):bad()}draw()}
function undoT(){if(M.pk===null){M.built.pop();draw()}}
function nxt(){if(M.i+1<M.qs.length){M.i++;M.pk=null;M.built=[];draw()}else{if(!M.prac){D.m[M.m]=M.got*5;save()}win();M.res=true;draw()}}

/* VIEWS */
function draw(){let h="";
 const nav=D&&v!="nama"&&v!="guru"?`<div class="nav">${PG.map(p=>`<button class="${v==p[0]?"on":""}" onclick="go('${p[0]}')">${p[1]} ${p[2]}</button>`).join("")}<button onclick="snd=!snd;draw()">${snd?"🔊":"🔇"}</button></div>`:"";

 if(o.v){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=o.v[0];lg.gain.value=o.v[1];l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+o.d)}os.start(t);os.stop(t+o.d+.05)}
